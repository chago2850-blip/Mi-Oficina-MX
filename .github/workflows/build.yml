name: Compilar instaladores

# En cada PR: pruebas + instaladores como artefactos.
# En cada push a main (o etiqueta v*): además se publica o actualiza el Release
# v<versión de package.json> con .exe (Windows), .dmg x64/arm64 (macOS),
# .deb, .rpm y .AppImage (Linux). Para sacar una versión nueva, sube "version" en package.json.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-mac:
    name: Linux + macOS (.deb .rpm .AppImage .dmg)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Herramientas del sistema
        # solo hacen falta para el .dmg; si los servidores de Ubuntu fallan, se sigue sin ellos
        continue-on-error: true
        timeout-minutes: 12
        run: |
          MISSING=""
          for p in rpm hfsprogs cmake libssl-dev zlib1g-dev libbz2-dev xvfb; do dpkg -s "$p" >/dev/null 2>&1 || MISSING="$MISSING $p"; done
          echo "faltan:$MISSING"
          [ -z "$MISSING" ] && exit 0
          # si el espejo de Azure no resuelve, se apunta al archivo oficial de Ubuntu
          if ! getent hosts azure.archive.ubuntu.com >/dev/null; then
            echo "espejo de Azure caído: se usa archive.ubuntu.com"
            printf 'Types: deb\nURIs: http://archive.ubuntu.com/ubuntu/\nSuites: noble noble-updates noble-backports\nComponents: main universe restricted multiverse\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n\nTypes: deb\nURIs: http://security.ubuntu.com/ubuntu/\nSuites: noble-security\nComponents: main universe restricted multiverse\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' | sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null
          fi
          for i in 1 2 3; do
            timeout 180 sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=15 && timeout 300 sudo apt-get install -y -o Acquire::Retries=2 $MISSING && exit 0
            sleep 20
          done
          pip install --user cmake || true
          exit 1
      - run: npm ci
      - name: Diccionarios de ortografía (sin internet en la app)
        continue-on-error: true
        run: xvfb-run -a npx electron --no-sandbox scripts/dict
      - name: Interfaz (minificada)
        run: NODE_ENV=production node scripts/build-ui.mjs
      - name: Pruebas de formatos
        run: node --no-warnings test/formats.test.mjs
      - name: Pruebas de punta a punta
        run: |
          npm i --no-save playwright@1.49.1
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e.mjs
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase2.mjs
          OFICINA_LANG=en xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase2.mjs
          python3 -m pip install --user -q msoffcrypto-tool pypdf cryptography || python3 -m pip install --break-system-packages -q msoffcrypto-tool pypdf cryptography || true
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase3.mjs
          OFICINA_LANG=en xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase3.mjs
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase4.mjs
          OFICINA_LANG=en xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase4.mjs
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase5.mjs
          OFICINA_LANG=en xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase5.mjs
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase5-estilos.mjs
          OFICINA_LANG=en xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase5-estilos.mjs
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase5-tablas.mjs
          OFICINA_LANG=en xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase5-tablas.mjs
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase5-insertar.mjs
          OFICINA_LANG=en xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase5-insertar.mjs
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase5-pagina.mjs
          OFICINA_LANG=en xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase5-pagina.mjs
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase5-herramientas.mjs
          OFICINA_LANG=en xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase5-herramientas.mjs
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase5-archivo.mjs
          OFICINA_LANG=en xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase5-archivo.mjs
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase8-calc2.mjs
          OFICINA_LANG=en xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase8-calc2.mjs
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase9-impresiona2.mjs
          OFICINA_LANG=en xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase9-impresiona2.mjs
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase10-calc3.mjs
          OFICINA_LANG=en xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase10-calc3.mjs
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase11-impresiona3.mjs
          OFICINA_LANG=en xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase11-impresiona3.mjs
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase12-impresiona4.mjs
          OFICINA_LANG=en xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase12-impresiona4.mjs
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase13-calc4.mjs
          OFICINA_LANG=en xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase13-calc4.mjs
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fuentes.mjs
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase6-calc.mjs
          OFICINA_LANG=en xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase6-calc.mjs
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase7-impresiona.mjs
          OFICINA_LANG=en xvfb-run -a -s "-screen 0 1600x1000x24" node test/e2e-fase7-impresiona.mjs
          xvfb-run -a -s "-screen 0 1600x1000x24" node test/a11y.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-pruebas
          path: |
            test/out/e2e/*.png
            test/out/fase2/*.png
            test/out/fase3/*.png
            test/out/fase4/*.png
          if-no-files-found: ignore
      - name: Instaladores de Linux
        run: npx electron-builder --linux AppImage deb rpm --x64 --publish never
      - name: Herramientas para el .dmg (rcodesign + libdmg-hfsplus)
        id: dmgtools
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          curl -sSL -o rcs.tgz "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz"
          tar xzf rcs.tgz
          git clone -q --depth 1 https://github.com/mozilla/libdmg-hfsplus.git
          cmake -S libdmg-hfsplus -B libdmg-hfsplus/build >/dev/null
          make -C libdmg-hfsplus/build -j"$(nproc)" >/dev/null
      - name: Instaladores de macOS (firma ad-hoc)
        # si falla por un error del proyecto, se detiene la publicación (antes se omitían los .dmg sin avisar)
        if: steps.dmgtools.outcome == 'success'
        run: |
          T="$RUNNER_TEMP/tools"
          RCODESIGN="$(find "$T" -type f -name rcodesign | head -1)" \
          HFSPLUS="$T/libdmg-hfsplus/build/hfs/hfsplus" \
          DMG="$T/libdmg-hfsplus/build/dmg/dmg" \
          bash scripts/build-mac-on-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MiOficinaMX-linux-mac
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diccionarios de ortografía (sin internet en la app)
        continue-on-error: true
        run: npx electron scripts/dict
      - name: Interfaz (minificada)
        run: node scripts/build-ui.mjs --min
      - name: Pruebas de formatos
        run: node --no-warnings test/formats.test.mjs
      - name: Instalador de Windows
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: MiOficinaMX-windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [linux-mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: MiOficinaMX-*
          path: artefactos
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Mi Oficina MX ${{ steps.v.outputs.version }}
          make_latest: true
          overwrite_files: true
          files: artefactos/*
          body: |
            ## Descargas

            | Sistema | Archivo |
            | --- | --- |
            | Windows 10/11 | `Mi.Oficina.MX.Setup.…exe` |
            | macOS Apple Silicon (M1–M4) | `MiOficinaMX-…-arm64.dmg` |
            | macOS Intel | `MiOficinaMX-…-x64.dmg` |
            | Ubuntu / Debian / Mint | `mi-oficina-mx_…_amd64.deb` |
            | Fedora / RHEL / openSUSE | `mi-oficina-mx-….x86_64.rpm` |
            | Cualquier Linux | `Mi.Oficina.MX-….AppImage` |

            Incluye **Escribiente** (textos), **Calcula Datos** (hojas de cálculo), **Impresiona** (presentaciones) y **PapelPDF** (PDF), con el Launcher tipo dona.

            **macOS:** la primera vez abre la app con clic derecho → Abrir. Si dice que "está dañada", ejecuta `xattr -cr "/Applications/Mi Oficina MX.app"`.
            **Windows:** si SmartScreen avisa, elige *Más información → Ejecutar de todas formas*.

            Software libre (GPL-3.0): sin marcas de agua, sin cuentas, sin anuncios y sin telemetría.
          generate_release_notes: true
